# Render Blueprint: deploys the API on the 100% Free plan (no credit card required).
services:
  - type: web
    name: facultyconnect-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run seed
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOW_DEMO_SEED
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: CLIENT_ORIGIN
        sync: false
